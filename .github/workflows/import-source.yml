name: Import FluxLab source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fluxlab-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and verify release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/fluxlab-source.br"
          : > "$archive"
          for sha in \
            4902169e34ed15f9c90749664ab482fcf5315b70 \
            e9fbf32669182386febea26aa726012c4ad310ff \
            c375942aa8d90b378586dea89ddc1e0dcac88ef0 \
            ca9c632732a6c55a8862cd6c094d03e33bfd4506 \
            e87baa111dd74a29b355bbd2c524a269f840ec53 \
            4c91344eef566119043d996a66a7080eb951d955
          do
            gh api "repos/$GH_REPO/git/blobs/$sha" --jq .content | base64 --decode >> "$archive"
          done
          echo "730bb8d3c0b6efd02da6b87b2e0bfef50776a3dd972fda82411c5fd739aadb2d  $archive" | sha256sum --check
      - name: Restore source files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs';
          import { brotliDecompressSync } from 'node:zlib';
          import { resolve, dirname, sep } from 'node:path';
          const archive = readFileSync(resolve(process.env.RUNNER_TEMP, 'fluxlab-source.br'));
          if (archive.length !== 62823) throw new Error('Archive length mismatch');
          const files = JSON.parse(brotliDecompressSync(archive).toString('utf8'));
          const root = process.cwd();
          if (Object.keys(files).length !== 37) throw new Error('File count mismatch');
          for (const [name, content] of Object.entries(files)) {
            const parts = name.split('/');
            if (!name || name.startsWith('/') || name.includes('\\') || parts.some(p => ['..', '.git', '.github'].includes(p)) || typeof content !== 'string') {
              throw new Error(`Invalid archive entry: ${name}`);
            }
            const target = resolve(root, name);
            if (!target.startsWith(root + sep)) throw new Error(`Path escapes checkout: ${name}`);
            mkdirSync(dirname(target), { recursive: true });
            writeFileSync(target, content, 'utf8');
            console.log(`Restored ${name}`);
          }
          NODE
      - name: Verify numerical solver and worker
        run: npm test
      - name: Build standalone app and static site
        run: npm run build
      - name: Commit full application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore .nojekyll LICENSE README.md package.json server.mjs index.html style.css favicon.svg fluxlab-standalone.html src docs examples tests test-results tools
          if ! git diff --cached --quiet; then
            git commit -m "Import FluxLab CFD workbench, solver, examples and verification suite"
            git push origin HEAD:main
          fi
          echo "Source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
